name: Source and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', architecture: x64}
          - {os: macos-14, python: '3.11', architecture: arm64}
          - {os: macos-15-intel, python: '3.14', architecture: x64}
          - {os: macos-26, python: '3.14', architecture: arm64}
          - {os: windows-2022, python: '3.11', architecture: x64}
          - {os: windows-2025, python: '3.13', architecture: x64}
    runs-on: ${{ matrix.os }}
    env:
      KORA_LUT_DIR: .ci-absent-fuji-luts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Build missing upstream Intel RAW wheel
        if: runner.os == 'macOS' && matrix.architecture == 'x64'
        run: |
          python -m pip install -r packaging/requirements-intel-build.txt
          python scripts/build_rawpy_intel.py
      - run: python -m pip install ".[emulation,optics]" build
      - run: python scripts/check_release.py
      - run: python -m compileall -q kora scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check kora/static/app.js
      - run: node --check kora/static/viewer.js
      - run: node --test tests/test_connection.cjs tests/test_diagnostics_js.cjs tests/test_film_choices_js.cjs tests/test_viewer.cjs tests/test_optics_js.cjs
