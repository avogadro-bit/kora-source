name: Source and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      KORA_LUT_DIR: .ci-absent-fuji-luts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[emulation,optics]" build
      - run: python scripts/check_release.py
      - run: python -m compileall -q kora scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check kora/static/app.js
      - run: node --check kora/static/viewer.js
      - run: node --test tests/test_connection.cjs tests/test_diagnostics_js.cjs tests/test_film_choices_js.cjs tests/test_viewer.cjs
