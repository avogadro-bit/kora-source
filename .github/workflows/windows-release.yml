name: Windows application build
on:
  workflow_dispatch:
  push:
    branches: ['build/windows-kora']
permissions:
  contents: read
jobs:
  windows:
    # A fixed runner avoids an implicit OS change when GitHub moves "latest".
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      KORA_LUT_DIR: .ci-absent-fuji-luts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c packaging/requirements-windows.txt ".[release,optics,emulation]"
      - name: Windows regression tests
        timeout-minutes: 4
        run: python -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); raise SystemExit(not result.wasSuccessful())"
      - run: node --check kora/static/app.js
      - run: node --test tests/test_film_choices_js.cjs tests/test_diagnostics_js.cjs
      - run: python scripts/prepare_release_notices.py
      - run: python -m scripts.build_windows_release
      - name: Save resolved dependency versions
        run: python -m pip list --format=freeze > dist/windows-release/requirements-resolved.txt
      - run: python scripts/smoke_windows_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kora-Windows-x64
          path: dist/windows-release/*
          if-no-files-found: error
