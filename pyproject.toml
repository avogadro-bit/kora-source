[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kora"
version = "0.2.40"
description = "Local multi-camera RAW studio with an independent Fujifilm LUT adapter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
dependencies = ["rawpy>=0.25,<1", "numpy>=2,<3", "Pillow>=11,<13", "pydantic>=2,<3", "tifffile>=2024.8", "scipy>=1.14,<2"]

[project.optional-dependencies]
emulation = ["unicorn>=2.1,<3", "capstone>=5,<6"]
optics = ["lensfunpy>=1.17,<2"]
release = ["pyinstaller>=6.22,<7", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "pywebview>=6.2.1,<7; sys_platform == 'darwin' or sys_platform == 'win32'"]

[project.scripts]
kora = "kora.__main__:main"

[tool.setuptools.package-data]
kora = ["static/*", "luts/*.json", "lensfun_db/*.xml", "lensfun_db/*.json", "lensfun_db/COPYING*"]

[tool.setuptools.packages.find]
include = ["kora*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.cube", "*.bin", "*.DAT"]
